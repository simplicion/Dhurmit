# ==============================================================================
# DHURMIT INFRASTRUCTURE BLUEPRINT FOR RENDER.COM
# ==============================================================================
# This blueprint automatically provisions:
# 1. Managed PostgreSQL Database (dhurmit-postgres)
# 2. Node.js Express API Web Service (dhurmit-api) with auto-migrations
# ==============================================================================

version: "1"

services:
  - type: web
    name: dhurmit-api
    runtime: node
    plan: free
    region: ohio
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: dhurmit-postgres
          property: connectionString
      - key: DATABASE_POOL_MIN
        value: 2
      - key: DATABASE_POOL_MAX
        value: 10
      - key: DATABASE_SSL
        value: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: 3600
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL_SECONDS
        value: 604800
      - key: CORS_ALLOWED_ORIGINS
        value: '*'
      - key: ONE_EIGHTY_CLIENT_ID
        value: 180_client_3b759b500c4b8a04f888ec3d91a82bd3
      - key: ONE_EIGHTY_CLIENT_SECRET
        value: 180_secret_c09a40cfc3e5c8acc1dd24ffd499dcd90e2b2773488c2f035765beb8a28eb7f5
      - key: ONE_EIGHTY_WEBHOOK_SECRET
        value: whsec_4ea6988e7fca03a2bdb4f7f4316814659a1e056aeb82ce35
      - key: ONE_EIGHTY_AUTH_URL
        value: https://auth.180workspace.com
      - key: ONE_EIGHTY_API_URL
        value: https://api.180core.cloud

databases:
  - name: dhurmit-postgres
    plan: free
    region: ohio
    databaseName: dhurmit_production
    user: dhurmit_user
