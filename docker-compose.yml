services:
  postgres:
    image: postgres:16-alpine
    container_name: committee_ledger_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: committee_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d committee_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: committee_ledger_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/committee_ledger
      JWT_ACCESS_SECRET: default_dev_secret_key_change_in_production_32chars
      JWT_REFRESH_SECRET: default_dev_refresh_key_change_in_production_32chars
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
